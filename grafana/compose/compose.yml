# Grafana for the platform service catalog (shared VM and customer VM).
#
# Rules of the platform compose policy this file follows:
#   - every service has CPU and memory limits
#   - the only network is the customer's own Docker network (portal.network, filled by the platform), declared external
#   - no container_name, no fixed volume names (the compose project name keeps them unique per deployment)
#   - no bind mounts (the platform sends only this file to the VM)
#   - secrets are never written here: GF_ADMIN_PASSWORD and GRAFANA_DB_PASSWORD are Secret Manager bindings
#     (template.secrets) and reach compose through the env file
#   - double-brace names are filled by the platform from the deploy form; dollar-brace names are read by compose from the env file
services:
  grafana:
    image: {{ IMAGE }}:{{ IMAGE_Tag }}
    restart: unless-stopped
    depends_on:
      grafana-db:
        condition: service_healthy
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-db:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_LEVEL: info
    volumes:
      - {{ CUSTOMER_VOLUME }}:/var/lib/grafana
    networks:
      - {{ CUSTOMER_NET }}
    deploy:
      resources:
        limits:
          cpus: {{ CPU }}
          memory: {{ MEMORY }}

  grafana-db:
    image: {{ IMAGE_POSTGRES }}:{{ POSTGRES_TAG }}
    restart: unless-stopped
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: {{ POSTGRES_USER }}
      POSTGRES_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - {{ CUSTOMER_NET }}
    deploy:
      resources:
        limits:
          cpus: {{ CPU_DB_GRAFANA }}
          memory: {{ MEMORY_DB_GRAFANA }}

volumes:
  {{ GRAFANA_DATA }}:
    name: {{ GRAFANA_DATA }}
    external: true
  {{ GRAFANA_DB }}:
    name: {{ GRAFANA_DB }}
    external: true

networks:
  {{ GRAFANA_NET }}:
    external: true
    name: "{{ portal.network }}"
