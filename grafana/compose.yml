services:
  grafana:
    image: pcr.amertka.com/grafana/grafana-oss:${IMAGE_TAG}
    container_name: grafana
    restart: ${RESTART_POLICY:-unless-stopped}

    depends_on:
      grafana-db:
        condition: service_healthy

    environment:
      # =========================
      # Server
      # =========================
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}

      # =========================
      # Database
      # =========================
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-db:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable

      # =========================
      # Admin bootstrap
      # =========================
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}

      # =========================
      # Security
      # =========================
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax

      # =========================
      # Logging
      # =========================
      GF_LOG_LEVEL: debug

      # =========================
      # Generic OAuth / Keycloak
      # =========================
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"

      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${KC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KC_CLIENT_SECRET}

      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email

      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KC_BASE_URL}/realms/${KC_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${KC_BASE_URL}/realms/${KC_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${KC_BASE_URL}/realms/${KC_REALM}/protocol/openid-connect/userinfo

      GF_AUTH_GENERIC_OAUTH_REDIRECT_URL: ${KC_REDIRECT_URL}

      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"

      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_NAME: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name

      # =========================
      # Role Mapping
      # =========================
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(resource_access.grafana.roles[*], 'grafanaadmin') && 'GrafanaAdmin' ||
        contains(resource_access.grafana.roles[*], 'grafana-admin') && 'Admin' ||
        contains(resource_access.grafana.roles[*], 'grafana-editor') && 'Editor' ||
        contains(resource_access.grafana.roles[*], 'grafana-viewer') && 'Viewer' ||
        'Viewer'

      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"

      # =========================
      # User defaults
      # =========================
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer


      # =========================
      # Organization Mapping
      # =========================
      GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH: team

      GF_AUTH_GENERIC_OAUTH_ORG_MAPPING: >-
        Amertka:Amertka:Admin
    
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "true"

    volumes:
      - grafana_data:/var/lib/grafana
      - grafana_dashboards:/var/lib/grafana/dashboards

      - type: bind
        source: ./provisioning
        target: /etc/grafana/provisioning
        read_only: true

    networks:
      - web_net
      - prometheus_net
      - grafana_internal

  grafana-db:
    image: pcr.amertka.com/library/postgres:16
    container_name: grafana-db
    restart: ${RESTART_POLICY:-unless-stopped}

    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GRAFANA_DB_PASSWORD}

    volumes:
      - grafana_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      - grafana_internal

  grafana-dashboard-sync:
    image: pcr.amertka.com/devops-img/alpine:v1.0
    container_name: grafana-dashboard-sync
    restart: unless-stopped
    environment:
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      GIT_USERNAME: ${GIT_USERNAME}

    command: >
      sh -c '
        if [ ! -d /git/.git ]; then
          git clone https://${GIT_USERNAME}:${GITLAB_TOKEN}@git.amertka.com/ady/infra/grafana-dashboards.git /git;
        else
          cd /git && git pull;
        fi;
      '

    volumes:
      - grafana_dashboards:/git

    networks:
      - grafana_internal

volumes:
  grafana_data:
    name: grafana_data

  grafana_db:
    name: grafana_db

  grafana_dashboards:
    name: grafana_dashboards

networks:
  web_net:
    external: true
    name: web_net

  prometheus_net:
    external: true
    name: prometheus_net

  grafana_internal:
    external: false
    name: grafana_internal

