# Grafana itself. It waits for the database, then runs with every setting of the deploy form. The admin and database
# passwords are read from the Secret the platform makes for the deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.registry }}/{{ .Values.dbImage }}:{{ .Values.dbTag }}"
          command: ["sh", "-c", "until pg_isready -h {{ .Release.Name | trunc 56 | trimSuffix "-" }}-db -p 5432; do sleep 2; done"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: grafana
          image: "{{ .Values.registry }}/{{ .Values.grafanaImage }}:{{ .Values.imageTag }}"
          ports:
            - containerPort: 3000
          env:
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: "{{ .Release.Name | trunc 56 | trimSuffix "-" }}-db:5432"
            - name: GF_DATABASE_NAME
              value: {{ .Values.dbName | quote }}
            - name: GF_DATABASE_USER
              value: {{ .Values.dbUser | quote }}
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "portal-{{ .Values.portal.name }}"
                  key: GRAFANA_DB_PASSWORD
            - name: GF_DATABASE_SSL_MODE
              value: disable
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "portal-{{ .Values.portal.name }}"
                  key: GF_ADMIN_PASSWORD
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: {{ .Values.rootUrl | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: {{ .Values.allowSignUp | quote }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.anonymousAccess | quote }}
            - name: GF_USERS_DEFAULT_THEME
              value: {{ .Values.defaultTheme | quote }}
            - name: GF_DATE_FORMATS_DEFAULT_TIMEZONE
              value: {{ .Values.timezone | quote }}
            - name: GF_INSTALL_PLUGINS
              value: {{ .Values.installPlugins | quote }}
            - name: GF_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: {{ .Values.cpu | quote }}
              memory: {{ .Values.memory | quote }}
            limits:
              cpu: {{ .Values.cpu | quote }}
              memory: {{ .Values.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | quote }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - port: 3000
      targetPort: 3000
