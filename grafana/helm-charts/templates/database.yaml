# PostgreSQL of Grafana. Its data is on the volume claim the customer chose (portal.pvc, made beforehand under
# Infrastructure > Kubernetes clusters); with no claim it is on scratch space and is lost when the pod is re-created.
# The password is read from the Secret the platform makes for the deployment (never written here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name | trunc 56 | trimSuffix "-" }}-db
  labels:
    app.kubernetes.io/name: grafana-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-db
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-db
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.registry }}/{{ .Values.dbImage }}:{{ .Values.dbTag }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.dbUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "portal-{{ .Values.portal.name }}"
                  key: GRAFANA_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          resources:
            requests:
              cpu: {{ .Values.dbCpu | quote }}
              memory: {{ .Values.dbMemory | quote }}
            limits:
              cpu: {{ .Values.dbCpu | quote }}
              memory: {{ .Values.dbMemory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
{{- if .Values.portal.pvc }}
          persistentVolumeClaim:
            claimName: {{ .Values.portal.pvc | quote }}
{{- else }}
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name | trunc 56 | trimSuffix "-" }}-db
  labels:
    app.kubernetes.io/name: grafana-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  selector:
    app.kubernetes.io/name: grafana-db
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - port: 5432
      targetPort: 5432
